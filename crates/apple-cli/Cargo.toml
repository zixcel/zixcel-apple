[package]
name = "zixcel-apple-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-apple"
description = "Reviewed native apple observations through the zix protocol"
publish = false
[[bin]]
name = "zix-apple"
path = "src/main.rs"
[dependencies]
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "c0d0c04eaa17b55491144a52d918810baf2f53a6" }
[dev-dependencies]
serde_json = "1.0"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
